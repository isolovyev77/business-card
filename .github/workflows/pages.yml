name: Deploy production site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare production files
        run: |
          set -euo pipefail
          mkdir -p /tmp/site-production
          rsync -av \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            ./ /tmp/site-production/
          touch /tmp/site-production/.nojekyll

      - name: Publish to gh-pages root
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          WORKDIR="$(mktemp -d)"

          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "${WORKDIR}"
          else
            git init "${WORKDIR}"
            cd "${WORKDIR}"
            git checkout --orphan gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          fi

          cd "${WORKDIR}"
          git fetch origin gh-pages:refs/remotes/origin/gh-pages >/dev/null 2>&1 || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages refs/remotes/origin/gh-pages
          fi

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name 'preview' \
            -exec rm -rf {} +

          rsync -av --delete /tmp/site-production/ ./

          if git status --short | grep . >/dev/null; then
            git add -A
            git commit -m "Deploy production site from ${GITHUB_SHA}"
            git push origin gh-pages
          else
            echo "No production changes to publish"
          fi
